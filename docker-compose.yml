services:
  backend:
    build:
      context: ./backend/demo
      target: development
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    env_file: ./backend/demo/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend/demo/src:/app/src:ro
      - ./backend/demo/pom.xml:/app/pom.xml:ro
    init: true

  frontend:
    build:
      context: ./frontend
      target: development
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8080
    depends_on:
      - backend
    init: true

services:
  backend:
    build:
      context: ./backend/demo
      target: production
    env_file: ./backend/demo/.env
    environment:
      PORT: 8080
    expose:
      - "8080"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_HOST: backend:8080
      PORT: 8080
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
